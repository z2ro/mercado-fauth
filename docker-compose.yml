services:
  banner:
    build: .
    ports:
      - "8000:8000"
    environment:
      BANNER_REMOVE_BACKGROUND: ${BANNER_REMOVE_BACKGROUND:-false}
      BANNER_ASSET_CACHE_DIR: /app/.cache/assets
      BANNER_ASSET_PADDING_RATIO: ${BANNER_ASSET_PADDING_RATIO:-0.04}
      BANNER_AI_CLASSIFICATION_ENABLED: ${BANNER_AI_CLASSIFICATION_ENABLED:-false}
      BANNER_AI_PROVIDER: ${BANNER_AI_PROVIDER:-}
      BANNER_AI_MODEL: ${BANNER_AI_MODEL:-}
      BANNER_AI_API_KEY: ${BANNER_AI_API_KEY:-}
      BANNER_CLASSIFICATION_MIN_CONFIDENCE: ${BANNER_CLASSIFICATION_MIN_CONFIDENCE:-0.70}
      BANNER_AI_TIMEOUT_SECONDS: ${BANNER_AI_TIMEOUT_SECONDS:-15}
      BANNER_CLASSIFICATION_CACHE_DIR: /app/.cache/classifications
      BANNER_AI_ART_DIRECTION_ENABLED: ${BANNER_AI_ART_DIRECTION_ENABLED:-false}
      BANNER_AI_ART_DIRECTION_PROVIDER: ${BANNER_AI_ART_DIRECTION_PROVIDER:-openai}
      BANNER_AI_ART_DIRECTION_MODEL: ${BANNER_AI_ART_DIRECTION_MODEL:-}
      BANNER_AI_ART_DIRECTION_TIMEOUT_SECONDS: ${BANNER_AI_ART_DIRECTION_TIMEOUT_SECONDS:-15}
      BANNER_ART_DIRECTION_CACHE_DIR: /app/.cache/art-direction
      BANNER_AI_VISUAL_QA_ENABLED: ${BANNER_AI_VISUAL_QA_ENABLED:-false}
      BANNER_AI_VISUAL_QA_PROVIDER: ${BANNER_AI_VISUAL_QA_PROVIDER:-openai}
      BANNER_AI_VISUAL_QA_MODEL: ${BANNER_AI_VISUAL_QA_MODEL:-}
      BANNER_AI_VISUAL_QA_TIMEOUT_SECONDS: ${BANNER_AI_VISUAL_QA_TIMEOUT_SECONDS:-20}
      BANNER_VISUAL_QA_MAX_RENDERS: ${BANNER_VISUAL_QA_MAX_RENDERS:-2}
      BANNER_BRAND_LOGO: ${BANNER_BRAND_LOGO:-}
    volumes:
      - ./assets:/app/assets:ro
      - ./output:/app/output
      - asset-cache:/app/.cache/assets
      - classification-cache:/app/.cache/classifications
      - art-direction-cache:/app/.cache/art-direction
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  asset-cache:
  classification-cache:
  art-direction-cache:
